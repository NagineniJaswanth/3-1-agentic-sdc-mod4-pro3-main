# Project-wide Gradle settings.

# Enables the use of AndroidX libraries (REQUIRED for your current dependencies)
android.useAndroidX=true

# Automatically converts old Support Library dependencies to AndroidX
android.enableJetifier=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables Gradle to run in parallel (speeds up builds)
org.gradle.parallel=true

# Enables caching to speed up subsequent builds
org.gradle.caching=true

# JVM arguments for Gradle daemon (adjusts memory allocation)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8